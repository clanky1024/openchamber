name: isolated spaces

on:
  pull_request:
    paths:
      - '.github/workflows/isolated-spaces.yml'
      - 'packages/web/server/lib/spaces/**'
      - 'packages/web/package.json'
      - 'packages/web/vitest.config.*'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-spaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Check Docker
        run: |
          docker version
          version=$(docker version --format '{{.Server.Version}}')
          test "${version%%.*}" -ge 28
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run isolated-space unit and live Docker tests
        env:
          OPENCHAMBER_TEST_DOCKER: '1'
        run: bun run --cwd packages/web test -- server/lib/spaces --maxWorkers=1
